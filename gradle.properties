org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=false
android.nonTransitiveRClass=true
kotlin.code.style=official

# The app's package ID. Forks should change this so their build installs
# alongside the original. Everything else (adb commands, the broadcast action,
# the screensaver's settings link) is derived from it.
dashboardsaver.applicationId=com.lotamaster.dashboardsaver

# Optional: a URL the app starts with before one is set. Don't put it here;
# put it in ~/.gradle/gradle.properties (outside the repo) or pass
# -Pdashboardsaver.defaultUrl=https://... on the command line.
# dashboardsaver.defaultUrl=
