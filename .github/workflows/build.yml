name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug lint

      - uses: actions/upload-artifact@v4
        with:
          name: dreampage-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        env:
          KEYSTORE_B64: ${{ secrets.DREAMPAGE_KEYSTORE_B64 }}
          DREAMPAGE_KEYSTORE_PASSWORD: ${{ secrets.DREAMPAGE_KEYSTORE_PASSWORD }}
          DREAMPAGE_KEY_ALIAS: ${{ secrets.DREAMPAGE_KEY_ALIAS }}
          DREAMPAGE_KEY_PASSWORD: ${{ secrets.DREAMPAGE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export DREAMPAGE_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "dreampage-${GITHUB_REF_NAME}.apk"
          sha256sum "dreampage-${GITHUB_REF_NAME}.apk" > "dreampage-${GITHUB_REF_NAME}.apk.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dreampage-*.apk
            dreampage-*.apk.sha256
